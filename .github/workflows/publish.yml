# Publish the container image to GitHub Container Registry.
#
# ghcr.io is free for public repositories: unlimited storage and bandwidth for
# public images, and GITHUB_TOKEN is enough to push, so there is no secret to
# configure. The image is code only -- the data packs are a separate release and
# are mounted at runtime -- so it stays small and carries nothing that is not
# this repository's to distribute.
#
#   docker run -p 8080:8080 -v "$PWD/data:/data:ro" ghcr.io/singhkartaar/gurbani-search-api
name: publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          # arm64 as well as amd64: a Raspberry Pi is a supported way to run this,
          # and onnxruntime-node publishes arm64 builds.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
